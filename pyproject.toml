[project]
name = "arden-ai"
version = "0.1.0"
description = "Permission-aware RAG and AI pipeline for Arden"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "chromadb>=1.3.0,<2",
  "fastapi>=0.120.0,<1",
  "langchain-chroma>=1.0.0,<2",
  "langchain-core>=1.0.0,<2",
  "langchain-openai>=1.0.0,<2",
  "langchain-text-splitters>=1.0.0,<2",
  "langfuse>=3.0.0,<4",
  "pydantic>=2.12.0,<3",
  "pydantic-settings>=2.11.0,<3",
  "tiktoken>=0.12.0,<1",
  "uvicorn[standard]>=0.38.0,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0,<1",
  "jsonschema>=4.26.0,<5",
  "mypy>=1.18.0,<2",
  "pytest>=8.4.0,<10",
  "pytest-cov>=7.0.0,<8",
  "ruff>=0.14.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arden_ai"]

[project.scripts]
arden-ai-export-schemas = "arden_ai.contracts.export_schemas:main"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["arden_ai"]

